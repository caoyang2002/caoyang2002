# 基础配置
baseURL = 'https://simons.qzz.io/'
languageCode = 'zh-CN'
title = '短松江月'
theme = 'hugo-focus'
ignoreLogs = ['warning-goldmark-raw-html']

# 设置默认语言（单语言站点，内容位于 content/zh）
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

# 基础优化配置
enableGitInfo = true
hasCJKLanguage = true
summaryLength = 140

# 分页（站点级配置）
paginate = 10
paginatePath = "page"

# 全局功能开关
comments = true

# 隐私相关配置
[privacy]
[privacy.x]
disable = false
enableDNT = false
simple = false

[privacy.vimeo]
disabled = false
simple = true

# 分类配置
[taxonomies]
category = "categories"
tag = "tags"
series = "series"

# Giscus 评论系统配置
[params.giscus]
repo = 'caoyang2002/caoyang2002'
repoId = 'R_kgDONgnnzg'
category = 'Announcements'
categoryId = 'DIC_kwDONgnnzs4ClayH'
mapping = 'pathname'
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "top"
crossorigin = "anonymous"
theme = 'light'
lang = 'zh-CN'

# RSS 订阅配置
[params.rss]
limit = 20
fullContent = true

# 文章配置
[permalinks]
posts = "/post/:year/:month/:filename/"

# 图片配置
[imaging]
quality = 75
resampleFilter = "Lanczos"
anchor = "Smart"

[imaging.exif]
disableDate = true
disableLatLong = true

# 主题参数配置
[params]
color = 'linen'
subtitle = '记录、思考与分享'
toc = true

# 个人信息配置
avatar = '/about/avatar.jpg'
bio = '难事必作于易，天下大事必作于细。'
author = "Simons"
logo = "/site/logo/logo.jpg"

# 社交媒体链接
twitter = 'caoyang2002'
github = 'caoyang2002'
instagram = 'caoyang2002'

disablePostNavigation = false # 禁用文章导航

# 其他设置
disableHLJS = false # 禁用 highlight.js 代码高亮
monoDarkIcon = false # 使用单色暗模式图标
math = true        # 全局启用 KaTeX 数学公式排版
localKatex = false # 使用本地 KaTeX js/css 而不是 CDN
favicon = "favicon.ico"                 # 自定义网站图标
appleTouchIcon = "apple-touch-icon.png" # 自定义苹果设备触摸图标

# RTL 支持
direction = "ltr" # 支持从右到左的语言排版

[params.contact]
email = 'reggiesimons2cy@gmail.com'

[outputs]
home = ["HTML", "RSS", "JSON"]

[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

# 语言配置（单语言）
[languages]
[languages.zh]
contentDir = 'content/zh'
staticDir = ['static']
notFound = "/404.html"
disabled = false
languageCode = 'zh-CN'
languageDirection = 'ltr'
languageName = 'Chinese'
title = '短松江月'
weight = 1
[languages.zh.params]
subtitle = '记录、思考与分享'

[markup]
defaultMarkdownHandler = "goldmark"

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true  # 允许 HTML 内容

[markup.goldmark.parser]
autoHeadingID = true
autoHeadingIDType = "github"

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.goldmark.extensions]
strikethrough = true
table = true
taskList = true
typographer = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[markup.tableOfContents]
endLevel = 4
startLevel = 1
ordered = false

[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = true
lineNos = false
lineNumbersInTable = true
noClasses = false
style = "monokai"
tabWidth = 4
